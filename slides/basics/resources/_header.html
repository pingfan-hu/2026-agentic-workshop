<script>
// ---- Embedded-site iframes ----
// Scrolling inside the embedded sites is fully NATIVE — no manual wheel
// interception (scrollBy + preventDefault hijacked wheel events during
// overview mode and killed native scrolling behaviors).

// Real filename -> display name shown in the fake address bar, so navigating the
// embedded site updates the URL to the educational page name.
var SITE_URL_NAMES = {
  's2-html-example.html': 'tom-hanks.html',
  's2-html-example-1.html': 'tom-hanks.html',
  's2-html-example-2.html': 'forrest-gump.html',
  's2-html-example-3.html': 'apollo-13.html',
  's2-html-example-4.html': 'saving-private-ryan.html',
  's2-html-example-5.html': 'cast-away.html',
  's2-html-example-6.html': 'captain-phillips.html',
  's2-structure-example-1.html': 'index.html',
  's2-structure-example-2.html': 'about.html',
  's2-structure-example-3.html': 'projects.html',
  's2-structure-example-4.html': 'contact.html'
};

window.wireSiteScroll = function(f) {
  try {
    var win = f.contentWindow, d = win.document;
    // Update the fake address bar to the current page (runs on every navigation).
    var urlEl = f.parentNode.querySelector('.site-url');
    var base = (win.location.pathname.split('/').pop() || '').replace(/\?.*$/, '');
    var displayName = SITE_URL_NAMES[base];
    if (urlEl && displayName) urlEl.textContent = displayName;
    // Highlight the file-tree row matching the page now shown in the preview.
    // Scoped to the current slide so other embedded sites are unaffected.
    var scope = f.closest ? f.closest('section') : null;
    if (scope) {
      scope.querySelectorAll('.site-tree .struct-file').forEach(function(row) {
        row.classList.toggle('is-active', row.getAttribute('data-file') === displayName);
      });
    }
  } catch (err) {}
  // A fresh document (first load or in-site navigation) needs the scroll lock
  // and its wheel forwarder re-applied; see lockSiteScroll below.
  if (window.lockSiteScroll) lockSiteScroll();
};

// ---- One scrollable site at a time ----
// Safari's compositor latches trackpad scroll gestures onto the last iframe
// that scrolled, even after Reveal moves to a different slide (the previous
// iframe stays in the DOM, merely hidden). Symptom: only the first embedded
// site you scroll ever scrolls; the ones on the other slides feel dead. This
// is the same disease the overview-mode code in control-buttons.html fights,
// and the same cure works: keep every embedded page except the current
// slide's physically unscrollable, and forward any wheel that WebKit still
// routes into a hidden page over to the embedded page on the current slide.
window.lockSiteScroll = function () {
  if (!(window.Reveal && Reveal.isReady && Reveal.isReady())) return;
  // Overview mode runs its own freeze in control-buttons.html; stay out.
  if (Reveal.isOverview && Reveal.isOverview()) return;
  var current = Reveal.getCurrentSlide();
  document.querySelectorAll('.reveal .slides iframe').forEach(function (f) {
    try {
      var w = f.contentWindow, d = w.document;
      var active = !!(current && current.contains(f));
      d.documentElement.style.overflow = active ? '' : 'hidden';
      if (d.body) d.body.style.overflow = active ? '' : 'hidden';
      // A hidden iframe holding focus keeps swallowing keys and gestures.
      if (!active && d.activeElement && d.activeElement.blur) d.activeElement.blur();
      if (!d.__navForward) {
        d.__navForward = function (e) {
          if (!(window.Reveal && Reveal.getCurrentSlide)) return;
          if (Reveal.isOverview && Reveal.isOverview()) return;
          var cur = Reveal.getCurrentSlide();
          if (!cur || cur.contains(f)) return; // the live frame scrolls natively
          var t = cur.querySelector('iframe');
          if (t && t.contentWindow) {
            // deltaMode 1 means lines, not pixels; approximate a line as 40px.
            var dy = e.deltaMode === 1 ? e.deltaY * 40 : e.deltaY;
            try { t.contentWindow.scrollBy(0, dy); } catch (err) { return; }
            e.preventDefault();
          }
        };
        d.addEventListener('wheel', d.__navForward, { capture: true, passive: false });
      }
      // Clicking inside an embedded site moves keyboard focus into the iframe,
      // which swallows the deck's keyboard shortcuts. Mirror every keydown onto
      // the parent document and let Reveal's own handler interpret it, so being
      // focused inside an iframe is equivalent to being focused on the slide
      // (arrows, O for overview, F for fullscreen, and anything added later).
      // Keys Reveal consumes are suppressed in the embedded page; keys it
      // ignores keep their native behavior there. Cmd/Ctrl combos are browser
      // shortcuts and stay native, and typing in embedded form fields is exempt.
      if (!d.__keyForward) {
        d.__keyForward = function (e) {
          var el = e.target;
          if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
          if (e.metaKey || e.ctrlKey) return;
          var clone = new KeyboardEvent(e.type, {
            key: e.key, code: e.code,
            shiftKey: e.shiftKey, altKey: e.altKey,
            repeat: e.repeat, bubbles: true, cancelable: true
          });
          // Reveal reads the legacy keyCode field, which synthetic events lack.
          var kc = e.keyCode, wh = e.which;
          try {
            Object.defineProperty(clone, 'keyCode', { get: function () { return kc; } });
            Object.defineProperty(clone, 'which', { get: function () { return wh; } });
          } catch (err2) {}
          document.dispatchEvent(clone);
          if (clone.defaultPrevented) e.preventDefault();
        };
        d.addEventListener('keydown', d.__keyForward, { capture: true });
      }
    } catch (err) { /* not loaded yet; wireSiteScroll re-runs this on load */ }
  });
};

// Reveal loads after this header script; poll until it is ready, then keep
// the lock in sync with navigation. The overviewhidden re-lock is deferred a
// tick so it runs after control-buttons.html restores its overview freeze.
(function pollLock(budget) {
  if (window.Reveal && Reveal.isReady && Reveal.isReady()) {
    lockSiteScroll();
    Reveal.on('slidechanged', function () { lockSiteScroll(); });
    Reveal.on('overviewhidden', function () { setTimeout(lockSiteScroll, 0); });
    return;
  }
  if (budget > 0) setTimeout(function () { pollLock(budget - 1); }, 100);
})(120);

// Click a file row in the structure tree to load that page in the sibling
// preview iframe. wireSiteScroll() (the iframe's onload) then updates the fake
// address bar and the active-row highlight.
window.openSitePage = function(el, target) {
  var section = el.closest && el.closest('section');
  var iframe = section && section.querySelector('iframe');
  if (iframe) iframe.src = iframe.src.replace(/[^\/]+$/, target + '?v=2');
};
</script>
